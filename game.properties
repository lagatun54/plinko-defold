[]
group-order = Plinko,Main,Platforms,Components,Runtime,Distribution
default-category = plinko

[plinko]
group = Plinko
title = Config
help = Количество корзин и вероятности попадания шара

slot_count.type = integer
slot_count.label = Количество корзин
slot_count.help = Целое число корзин слева направо, от 2 до 32. Должно совпадать с длиной списка весов (если веса заданы) и с SLOT_POINTS в config.lua.
slot_count.minimum = 2
slot_count.maximum = 32
slot_count.default = 10

slot_weights.type = string
slot_weights.label = Веса корзин
slot_weights.help = Веса корзин слева направо через запятую. Вероятность = вес / сумма всех весов. Нуль исключает корзину, nil включает свободную физику.
slot_weights.default = 0, 0, 0, 5, 95, 0, 0, 0, 0, 0
